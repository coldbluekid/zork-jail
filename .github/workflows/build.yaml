name: Publish Rancher Chunks as Release
on: 
  workflow_dispatch: 

permissions:
  contents: write # Crucial: Allows the pipeline to create a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Official Rancher Image
        run: docker pull rancher/rancher:latest

      - name: Save Image to Tarball
        run: docker save -o rancher-server.tar rancher/rancher:latest

      - name: Encode and Split into 200MB Text Chunks
        run: |
          mkdir release_chunks
          base64 rancher-server.tar | split -b 200m --additional-suffix=.txt - release_chunks/rancher_part_

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: rancher-build-${{ github.run_id }}
          name: "Rancher Offline Chunks"
          files: release_chunks/*
