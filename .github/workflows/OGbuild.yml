name: Build and Export Zork Container
on: [push] 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build the Docker Image
        run: docker build -t zork-jail:v1 .

      - name: Save Image to Tarball
        run: docker save -o zork-jail.tar zork-jail:v1

      - name: Encode to Base64
        run: |
          mkdir output_folder
          base64 zork-jail.tar > output_folder/zork-jail.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zork-offline-text
          path: output_folder/
